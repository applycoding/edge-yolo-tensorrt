# Paths used by `edge-yolo export-onnx` and `edge-yolo export-trt`.
# Build TensorRT engines on the Jetson that will run them. An engine built
# for one GPU architecture will not load on another.
weights: runs/detect/coco128/weights/best.pt
imgsz: 640
opset: 17
simplify: true
dynamic: false
onnx_path: artifacts/coco128.onnx
fp16_engine: artifacts/coco128_fp16.engine
int8_engine: artifacts/coco128_int8.engine
workspace_mib: 2048
calibration_dir: data/calibration
calibration_cache: artifacts/coco128_int8.cache
